mission:
  takeoff_height: 1.60
  takeoff_wait_sec: 5.0
  waypoint_reach_xy_tol: 0.18
  waypoint_reach_z_tol: 0.12
  waypoint_reach_yaw_tol_deg: 8.0
  command_rate_hz: 10.0
  decode_interval_sec: 0.20
  success_repeat_threshold: 2
  abort_on_scan_fail: false
  land_after_finish: true
  gimbal_settle_sec: 1.0
  show_debug_window: false
  center_distance_weight: 0.002
  gimbal_fixed_roll_deg: 0.0
  gimbal_fixed_pitch_deg: 0.0
  gimbal_fixed_yaw_deg: 0.0
  save_root: "~/p450_results/book_qr_patrol"
  expected_txt_dir: "~/book_qr_demo/output"

waypoints:
  - {name: front_left,  stage: front,   scan: true,  x: 1.20, y: -0.80, z: 1.60, yaw_deg: 0.0,   hold_sec: 1.5, scan_timeout_sec: 6.0, note: '白板正面左二维码'}
  - {name: front_mid,   stage: front,   scan: true,  x: 1.20, y:  0.00, z: 1.60, yaw_deg: 0.0,   hold_sec: 1.5, scan_timeout_sec: 6.0, note: '白板正面中二维码'}
  - {name: front_right, stage: front,   scan: true,  x: 1.20, y:  0.80, z: 1.60, yaw_deg: 0.0,   hold_sec: 1.5, scan_timeout_sec: 6.0, note: '白板正面右二维码'}
  - {name: transit_front_right_clear, stage: transfer, scan: false, x: 1.00, y: 1.30, z: 1.60, yaw_deg: 90.0,  hold_sec: 1.0, scan_timeout_sec: 2.0, note: '离开白板正面右侧'}
  - {name: transit_to_back_entry,     stage: transfer, scan: false, x: 0.00, y: 1.60, z: 1.60, yaw_deg: 180.0, hold_sec: 1.0, scan_timeout_sec: 2.0, note: '准备进入白板背面'}
  - {name: back_left,  stage: back,    scan: true,  x: -1.20, y:  0.80, z: 1.60, yaw_deg: 180.0, hold_sec: 1.5, scan_timeout_sec: 6.0, note: '白板背面左二维码'}
  - {name: back_mid,   stage: back,    scan: true,  x: -1.20, y:  0.00, z: 1.60, yaw_deg: 180.0, hold_sec: 1.5, scan_timeout_sec: 6.0, note: '白板背面中二维码'}
  - {name: back_right, stage: back,    scan: true,  x: -1.20, y: -0.80, z: 1.60, yaw_deg: 180.0, hold_sec: 1.5, scan_timeout_sec: 6.0, note: '白板背面右二维码'}
