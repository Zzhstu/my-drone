<text x="1475" y="643.18" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="21" font-weight="400" fill="#15334C" text-anchor="start">返回、保存与完整性</text>
<text x="1475" y="671.3199999999999" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="21" font-weight="400" fill="#15334C" text-anchor="start">分别记录。</text>
<text x="1480" y="729.0" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="700" fill="#CB5263" text-anchor="start">结束 ≠ 全图完整</text>
