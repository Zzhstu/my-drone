<text x="995" y="906.18" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="22" font-weight="400" fill="#15334C" text-anchor="start">返航1200仿真秒超时；运行器4800真实秒硬保护。</text>
<text x="995" y="935.66" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="22" font-weight="400" fill="#15334C" text-anchor="start">受阻、超时或人工中断不是成功探索，不能隐藏失败。</text>
