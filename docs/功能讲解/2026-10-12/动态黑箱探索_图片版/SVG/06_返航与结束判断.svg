<text x="65" y="93.0" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="47" font-weight="700" fill="#15334C" text-anchor="start">返航与结束：返回保存，和完整探索分开判断</text>
<text x="68" y="147.0" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="25" font-weight="400" fill="#657585" text-anchor="start">没有有效新目标不等于全仓扫完；每次收尾必须保留真实原因</text>
<polyline points="65.00,181.00 1855.00,181.00" fill="none" stroke="#DCE5EB" stroke-width="1"/>
<text x="65" y="1048.0" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="21" font-weight="700" fill="#137B7E" text-anchor="start">机制示意｜默认完成后关闭本次仿真；可显式保留展示。不声称真机自动降落或完全建图。</text>
<text x="1764" y="1050.0" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" fill="#657585" text-anchor="start">06 / 08</text>
<rect x="75" y="232" width="852" height="251" fill="#EDF8F0" stroke="#A6D2BD" stroke-width="2"/>
<text x="95" y="274.0" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="700" fill="#15334C" text-anchor="start">观测范围收敛：多项条件同时成立</text>
<text x="95" y="314.18" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="22" font-weight="400" fill="#15334C" text-anchor="start">完整增益窗口变小；已看表面质量至少95%；</text>
<text x="95" y="343.66" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="22" font-weight="400" fill="#15334C" text-anchor="start">无有用前沿、无剩余补扫候选、无目标失败记录，</text>
<text x="95" y="373.14" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="22" font-weight="400" fill="#15334C" text-anchor="start">观测格与表面证据没有容量不足。</text>
<text x="95" y="402.62" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="22" font-weight="400" fill="#15334C" text-anchor="start">只能认证当前已观测可达范围，仍不等于全三维完整。</text>
<rect x="975" y="232" width="870" height="251" fill="#FFF3E5" stroke="#E9C291" stroke-width="2"/>
<text x="995" y="274.0" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="700" fill="#15334C" text-anchor="start">部分结果：预算、限制或人工请求</text>
<text x="995" y="314.18" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="22" font-weight="400" fill="#15334C" text-anchor="start">探索3600仿真秒 / 3600真实秒预算；</text>
<text x="995" y="343.66" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="22" font-weight="400" fill="#15334C" text-anchor="start">补扫600仿真秒预算；容量不足、视点耗尽、</text>
<text x="995" y="373.14" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="22" font-weight="400" fill="#15334C" text-anchor="start">人工请求或显式目标数上限，均需写明结束原因。</text>
<text x="995" y="402.62" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="22" font-weight="400" fill="#15334C" text-anchor="start">部分探索可以返航保存，但完整性不能改成成功。</text>
