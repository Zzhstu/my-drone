<text x="95" y="906.18" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="22" font-weight="400" fill="#15334C" text-anchor="start">离开起点、暂停、过期输入或机位不安全，驻留重新计时。</text>
<text x="95" y="935.66" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="22" font-weight="400" fill="#15334C" text-anchor="start">断流不继续发布新的探索航点；保存失败不能假报完成。</text>
