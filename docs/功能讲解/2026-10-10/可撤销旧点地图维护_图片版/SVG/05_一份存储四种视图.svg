<rect x="90" y="275" width="390" height="300" fill="#EEF8F1" stroke="#A6CCB7" stroke-width="1.6"/>
<text x="106" y="317.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="700" fill="#15334C" text-anchor="start">一份可修改存储</text>
