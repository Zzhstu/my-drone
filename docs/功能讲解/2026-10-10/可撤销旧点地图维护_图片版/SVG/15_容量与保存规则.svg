<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect x="0" y="0" width="1600" height="900" fill="#FFFFFF" stroke="none" stroke-width="1.6"/>
<text x="60" y="80.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="46" font-weight="700" fill="#15334C" text-anchor="start">持续地图也要有容量与保存规则</text>
<text x="63" y="125.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#657585" text-anchor="start">地图删除有两种原因：观测确认失效，或者容量保护淘汰。</text>
<polyline points="60,151 1540,151" fill="none" stroke="#D5E0E6" stroke-width="1.2"/>
<rect x="60" y="784" width="1480" height="62" fill="#EFF5F8" stroke="none" stroke-width="1.6"/>
<text x="78" y="823.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#137B7E" text-anchor="start">核心规则</text>
<text x="210" y="822.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#15334C" text-anchor="start">保存的是当前维护图快照，不在导出时额外裁剪人体来制造“零鬼影”。</text>
<text x="60" y="878.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#657585" text-anchor="start">现有源码规则 · 所有点云与场景小图为示意 · 非新增实验结果</text>
<text x="1400" y="879.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#657585" text-anchor="start">15 / 16</text>
<rect x="60.0" y="214" width="341.5" height="425" fill="#F0F0FF" stroke="#B3BFEA" stroke-width="1.6"/>
<text x="76.0" y="258.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#15334C" text-anchor="start">1 约束清理开销</text>
<text x="78.0" y="300.64" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#15334C" text-anchor="start">最多8000条射线、20万个自</text>
<text x="78.0" y="333.76" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#15334C" text-anchor="start">由格。</text>
<polyline points="404.5,426.5 436.5,426.5" fill="none" stroke="#24618A" stroke-width="2"/>
<polygon points="436.50,426.50 426.50,431.30 426.50,421.70" fill="#24618A" stroke="none" stroke-width="1.6"/>
<rect x="439.5" y="214" width="341.5" height="425" fill="#FFF3E7" stroke="#E6B988" stroke-width="1.6"/>
<text x="455.5" y="258.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#15334C" text-anchor="start">2 限制地图容量</text>
<text x="457.5" y="300.64" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#15334C" text-anchor="start">最多50万格；超限淘汰久未</text>
<text x="457.5" y="333.76" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#15334C" text-anchor="start">命中的格。</text>
<polyline points="784.0,426.5 816.0,426.5" fill="none" stroke="#24618A" stroke-width="2"/>
<polygon points="816.00,426.50 806.00,431.30 806.00,421.70" fill="#24618A" stroke="none" stroke-width="1.6"/>
<rect x="819.0" y="214" width="341.5" height="425" fill="#EEF8F1" stroke="#A6CCB7" stroke-width="1.6"/>
<text x="835.0" y="258.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#15334C" text-anchor="start">3 定时输出视图</text>
<text x="837.0" y="300.64" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#15334C" text-anchor="start">设置每秒2次；重发不增加观</text>
<text x="837.0" y="333.76" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#15334C" text-anchor="start">测证据。</text>
<polyline points="1163.5,426.5 1195.5,426.5" fill="none" stroke="#24618A" stroke-width="2"/>
<polygon points="1195.50,426.50 1185.50,431.30 1185.50,421.70" fill="#24618A" stroke="none" stroke-width="1.6"/>
<rect x="1198.5" y="214" width="341.5" height="425" fill="#FFF0F5" stroke="#DCB0C3" stroke-width="1.6"/>
<text x="1214.5" y="258.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#15334C" text-anchor="start">4 保存真实快照</text>
<text x="1216.5" y="300.64" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#15334C" text-anchor="start">有限点、来源、时间、点数</text>
<text x="1216.5" y="333.76" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#15334C" text-anchor="start">和校验信息。</text>
