<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect x="0" y="0" width="1600" height="900" fill="#FFFFFF" stroke="none" stroke-width="1.6"/>
<text x="60" y="80.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="46" font-weight="700" fill="#15334C" text-anchor="start">我们制定的规则：敢更新，也不随意删</text>
<text x="63" y="125.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#657585" text-anchor="start">关注人离开后旧占用的恢复，同时保留货架与当前真实障碍。</text>
<polyline points="60,151 1540,151" fill="none" stroke="#D5E0E6" stroke-width="1.2"/>
<rect x="60" y="784" width="1480" height="62" fill="#EFF5F8" stroke="none" stroke-width="1.6"/>
<text x="78" y="823.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#137B7E" text-anchor="start">核心规则</text>
<text x="210" y="822.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#15334C" text-anchor="start">这是可追查的地图维护工程层，不是全图零鬼影或完整建图的保证。</text>
<text x="60" y="878.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#657585" text-anchor="start">现有源码规则 · 所有点云与场景小图为示意 · 非新增实验结果</text>
<text x="1400" y="879.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#657585" text-anchor="start">16 / 16</text>
<rect x="60.0" y="214" width="468.0" height="482" fill="#F0F0FF" stroke="#B3BFEA" stroke-width="1.6"/>
<text x="76.0" y="258.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#15334C" text-anchor="start">现有核心规则</text>
<text x="78.0" y="300.64" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#15334C" text-anchor="start">同帧同格只记一次。</text>
<text x="78.0" y="333.76" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#15334C" text-anchor="start">共享存储派生多视图。</text>
<text x="78.0" y="366.88" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#15334C" text-anchor="start">探索不凭轨迹擦除。</text>
<text x="78.0" y="400.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#15334C" text-anchor="start">当前返回优先保护。</text>
<polyline points="531.0,455.0 563.0,455.0" fill="none" stroke="#24618A" stroke-width="2"/>
<polygon points="563.00,455.00 553.00,459.80 553.00,450.20" fill="#24618A" stroke="none" stroke-width="1.6"/>
<rect x="566.0" y="214" width="468.0" height="482" fill="#FFF3E7" stroke="#E6B988" stroke-width="1.6"/>
<text x="582.0" y="258.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#15334C" text-anchor="start">删除必须有条件</text>
<text x="584.0" y="300.64" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#15334C" text-anchor="start">射线经过旧点附近。</text>
<text x="584.0" y="333.76" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#15334C" text-anchor="start">距命中至少0.5秒。</text>
<text x="584.0" y="366.88" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#15334C" text-anchor="start">证据间隔不超过1秒。</text>
<text x="584.0" y="400.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#15334C" text-anchor="start">普通3次、稳定6次。</text>
<polyline points="1037.0,455.0 1069.0,455.0" fill="none" stroke="#24618A" stroke-width="2"/>
<polygon points="1069.00,455.00 1059.00,459.80 1059.00,450.20" fill="#24618A" stroke="none" stroke-width="1.6"/>
<rect x="1072.0" y="214" width="468.0" height="482" fill="#EEF8F1" stroke="#A6CCB7" stroke-width="1.6"/>
<text x="1088.0" y="258.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#15334C" text-anchor="start">必须保留的边界</text>
<text x="1090.0" y="300.64" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#15334C" text-anchor="start">未再观测不保证清除。</text>
<text x="1090.0" y="333.76" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#15334C" text-anchor="start">当前人体仍是障碍。</text>
<text x="1090.0" y="366.88" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#15334C" text-anchor="start">自由视图不是删除授权。</text>
<text x="1090.0" y="400.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#15334C" text-anchor="start">不自动改内部匹配树。</text>
<text x="72" y="750.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#137B7E" text-anchor="start">建议成对检验：旧点残留 + 静态保留 + 恢复路线 + 处理开销；本轮没有新飞行实验。</text>
</svg>