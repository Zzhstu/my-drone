<text x="1214.5" y="258.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#15334C" text-anchor="start">4 保留模式边界</text>
<text x="1216.5" y="300.64" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#15334C" text-anchor="start">清理快，但假动态与轨迹范</text>
