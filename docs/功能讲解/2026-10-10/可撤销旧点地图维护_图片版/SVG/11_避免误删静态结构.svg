<text x="455.5" y="258.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#15334C" text-anchor="start">2 当前表面优先</text>
<text x="457.5" y="300.64" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#15334C" text-anchor="start">旧格周围27个邻格有回波就</text>
<text x="457.5" y="333.76" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#15334C" text-anchor="start">保护。</text>
<polyline points="784.0,426.5 816.0,426.5" fill="none" stroke="#24618A" stroke-width="2"/>
<polygon points="816.00,426.50 806.00,431.30 806.00,421.70" fill="#24618A" stroke="none" stroke-width="1.6"/>
<rect x="819.0" y="214" width="341.5" height="425" fill="#EEF8F1" stroke="#A6CCB7" stroke-width="1.6"/>
<text x="835.0" y="258.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#15334C" text-anchor="start">3 射线确实矛盾</text>
<text x="837.0" y="300.64" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#15334C" text-anchor="start">旧代表点距离射线不超过6厘</text>
<text x="837.0" y="333.76" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#15334C" text-anchor="start">米。</text>
