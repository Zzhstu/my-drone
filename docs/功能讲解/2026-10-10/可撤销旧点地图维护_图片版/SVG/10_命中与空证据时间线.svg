<text x="210" y="822.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#15334C" text-anchor="start">命中就清零；过期证据不能无限拼凑成删除授权。</text>
<text x="60" y="878.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#657585" text-anchor="start">现有源码规则 · 所有点云与场景小图为示意 · 非新增实验结果</text>
<text x="1400" y="879.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#657585" text-anchor="start">10 / 16</text>
<rect x="60" y="213" width="700" height="168" fill="#FFF3E7" stroke="#E6B988" stroke-width="1.6"/>
<text x="76" y="257.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#15334C" text-anchor="start">普通旧格：3次有效空证据</text>
<text x="78" y="299.64" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#15334C" text-anchor="start">少量观测形成的占用，较早进入撤销。</text>
<rect x="800" y="213" width="740" height="168" fill="#EEF8F1" stroke="#A6CCB7" stroke-width="1.6"/>
<text x="816" y="257.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#15334C" text-anchor="start">稳定旧格：6次有效空证据</text>
<text x="818" y="299.64" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#15334C" text-anchor="start">至少8次命中，更谨慎地撤销旧占用。</text>
