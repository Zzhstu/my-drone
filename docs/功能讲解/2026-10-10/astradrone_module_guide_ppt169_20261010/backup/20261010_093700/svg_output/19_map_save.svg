<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" data-pptx-page-role="content">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#168B80"/></marker></defs>
<g id="p19-bg" data-pptx-bounds="0 0 1280 720" data-pptx-role="background"><rect width="1280" height="720" fill="#F7F9FB"/></g>
<g id="p19-title" data-pptx-bounds="52 42 1176 120"><text x="52" y="92" font-size="42" font-weight="bold" fill="#16334A">点云保存：把真实维护结果带走</text><text x="52" y="145" font-size="28" fill="#617382">保存实际话题中的地图，不按世界真值裁出一张“好图”。</text></g>
<g id="p19-body" data-pptx-bounds="52 206 548 424"><text x="52" y="238" font-size="28" fill="#16334A">作用：让结果可离线查看和比较</text><text x="52" y="286" fill="#253746"><tspan x="52">读取维护地图的最新点云，</tspan><tspan x="52" dy="36">保存有效的三维坐标和来源记录。</tspan><tspan x="52" dy="36">文件与运行前缀、时间关联。</tspan></text><text x="52" y="429" font-size="28" fill="#16334A">规则：拒绝过期，完整写入再替换</text><text x="52" y="477" fill="#253746"><tspan x="52">最新接收超过3秒时拒绝保存。</tspan><tspan x="52" dy="36">去掉无效坐标，先写临时文件，</tspan><tspan x="52" dy="36">成功后再替换目标地图文件。</tspan><tspan x="52" dy="36">失败说明原因，不能假报成功。</tspan></text><text x="52" y="621" font-size="18" fill="#D67B29">文件存在只证明保存成功，不证明没有鬼影或扫描完整。</text></g>
<g id="p19-flow" data-pptx-bounds="654 206 574 412"><rect x="654" y="206" width="574" height="412" rx="12" fill="#EAF3F2"/><rect x="692" y="230" width="498" height="58" rx="12" fill="#FFFFFF"/><text x="941" y="269" text-anchor="middle" fill="#253746">实际维护地图 → 收到保存请求</text><line x1="941" y1="294" x2="941" y2="319" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)"/><rect x="692" y="328" width="498" height="58" rx="12" fill="#FFFFFF"/><text x="941" y="367" text-anchor="middle" fill="#253746">检查消息时间与有效坐标</text><line x1="941" y1="392" x2="941" y2="420" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)"/><rect x="692" y="430" width="498" height="58" rx="12" fill="#FFFFFF"/><text x="941" y="469" text-anchor="middle" fill="#253746">写临时文件 → 成功后替换最终文件</text><line x1="941" y1="494" x2="941" y2="521" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)"/><rect x="692" y="532" width="498" height="58" rx="12" fill="#168B80"/><text x="941" y="571" text-anchor="middle" fill="#FFFFFF">点云文件 + 来源说明 + 保存结果</text></g>
<g id="p19-footer" data-pptx-bounds="52 661 1176 30"><line x1="52" y1="660" x2="1228" y2="660" stroke="#D3DEE5"/><text x="52" y="686" font-size="16" fill="#617382">默认输出目录：dynamic_demo_runs · 文件后缀：_final_map.pcd</text><text x="1228" y="686" text-anchor="end" font-size="16" fill="#617382">19 / 22</text></g>
</svg>
