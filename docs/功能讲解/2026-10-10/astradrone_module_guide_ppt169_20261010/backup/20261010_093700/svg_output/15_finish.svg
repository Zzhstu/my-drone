<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" data-pptx-page-role="content">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#168B80"/></marker></defs>
<g id="p15-bg" data-pptx-bounds="0 0 1280 720" data-pptx-role="background"><rect width="1280" height="720" fill="#F7F9FB"/></g>
<g id="p15-title" data-pptx-bounds="52 42 1176 120"><text x="52" y="92" font-size="42" font-weight="bold" fill="#16334A">补扫与结束：返航不等于全图完整</text><text x="52" y="145" font-size="28" fill="#617382">“不再探索”“回到起点”“保存地图”是不同条件。</text></g>
<g id="p15-body" data-pptx-bounds="52 206 548 426"><text x="52" y="238" font-size="28" fill="#16334A">作用：防止一直探索或草率结束</text><text x="52" y="286" fill="#253746"><tspan x="52">长时间新空间增益低时，</tspan><tspan x="52" dy="36">检查可达的薄弱表面并补扫。</tspan><tspan x="52" dy="36">不同位置、方向的重复观察更可靠。</tspan></text><text x="52" y="429" font-size="28" fill="#16334A">规则：收敛、部分结果要分别标记</text><text x="52" y="477" fill="#253746"><tspan x="52">无可达新收益且质量等条件成立，</tspan><tspan x="52" dy="36">才说已观测可达区域收敛。</tspan><tspan x="52" dy="36">预算耗尽返航则标记为部分结果。</tspan><tspan x="52" dy="36">起点0.30米内停5秒且保存后完成。</tspan></text><text x="52" y="621" font-size="18" fill="#D67B29">已测表面95%不含从未看见的货架，不是全仓库完整率。</text></g>
<g id="p15-flow" data-pptx-bounds="654 206 574 412"><rect x="654" y="206" width="574" height="412" rx="12" fill="#EAF3F2"/><rect x="690" y="230" width="496" height="58" rx="12" fill="#FFFFFF"/><text x="938" y="269" text-anchor="middle" fill="#253746">探索增益低 → 检查补扫与质量</text><line x1="938" y1="294" x2="938" y2="319" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)"/><rect x="690" y="329" width="496" height="86" rx="12" fill="#FFFFFF"/><text x="938" y="365" text-anchor="middle" fill="#253746"><tspan x="938">还有可达收益：继续探索或补扫</tspan><tspan x="938" dy="32" font-size="18">无收益且满足条件：收敛；预算停止：部分</tspan></text><line x1="938" y1="421" x2="938" y2="447" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)"/><rect x="690" y="457" width="496" height="56" rx="12" fill="#FFFFFF"/><text x="938" y="495" text-anchor="middle" fill="#253746">返航到家，稳定停留，确认保存</text><line x1="938" y1="519" x2="938" y2="532" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)"/>
<g id="p15-complete" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="flowChartTerminator" data-pptx-frame="690 540 496 56" fill="#168B80" stroke="none">
<path d="M 769.8 540 L 1106.2 540 A 79.8 28 0 0 1 1106.2 596 L 769.8 596 A 79.8 28 0 0 1 769.8 540 Z"/>
</g>
<text x="938" y="578" text-anchor="middle" fill="#FFFFFF">任务结束；完整性仍需独立验收</text></g>
<g id="p15-footer" data-pptx-bounds="52 661 1176 30"><line x1="52" y1="660" x2="1228" y2="660" stroke="#D3DEE5"/><text x="52" y="686" font-size="16" fill="#617382">结束状态、返航条件与覆盖验收不能混为一谈</text><text x="1228" y="686" text-anchor="end" font-size="16" fill="#617382">15 / 22</text></g>
</svg>
