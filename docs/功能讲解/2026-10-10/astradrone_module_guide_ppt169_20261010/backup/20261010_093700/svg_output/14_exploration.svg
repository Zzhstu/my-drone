<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" data-pptx-page-role="content">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#168B80"/></marker></defs>
<g id="p14-bg" data-pptx-bounds="0 0 1280 720" data-pptx-role="background"><rect width="1280" height="720" fill="#F7F9FB"/></g>
<g id="p14-title" data-pptx-bounds="52 42 1176 120"><text x="52" y="92" font-size="42" font-weight="bold" fill="#16334A">自主探索：从已知空间走向未知边界</text><text x="52" y="145" font-size="28" fill="#617382">不是提前知道货架布局，而是边观察、边选择下一处视角。</text></g>
<g id="p14-body" data-pptx-bounds="52 206 548 428"><text x="52" y="238" font-size="28" fill="#16334A">作用：自己决定下一站去哪看</text><text x="52" y="286" fill="#253746"><tspan x="52">根据扫描区分未知、自由和占用。</tspan><tspan x="52" dy="36">从可到达的未知边界选择目标，</tspan><tspan x="52" dy="36">衡量能多看到多少与走路代价。</tspan></text><text x="52" y="429" font-size="28" fill="#16334A">规则：只走已有安全证据的空间</text><text x="52" y="477" fill="#253746"><tspan x="52">未知区不能直接当成安全通道。</tspan><tspan x="52" dy="36">失败目标暂时降权，避免反复卡住。</tspan><tspan x="52" dy="36">起点受新障碍影响时，有条件短退。</tspan><tspan x="52" dy="36">当前控制速度上限0.30米/秒。</tspan></text><text x="52" y="621" font-size="18" fill="#D67B29">正常余量0.80米；恢复下限0.45米只用于受检查的短退。</text></g>
<g id="p14-flow" data-pptx-bounds="654 206 574 412"><rect x="654" y="206" width="574" height="412" rx="12" fill="#EAF3F2"/><rect x="694" y="232" width="492" height="59" rx="12" fill="#FFFFFF"/><text x="940" y="272" text-anchor="middle" fill="#253746">新扫描：更新未知、自由与占用</text><line x1="940" y1="297" x2="940" y2="324" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)"/><rect x="694" y="334" width="492" height="59" rx="12" fill="#FFFFFF"/><text x="940" y="374" text-anchor="middle" fill="#253746">找可达边界，估计新观察收益</text><line x1="940" y1="399" x2="940" y2="426" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)"/><rect x="694" y="436" width="492" height="59" rx="12" fill="#168B80"/><text x="940" y="476" text-anchor="middle" fill="#FFFFFF">选目标、找安全路线、发航点</text><line x1="940" y1="501" x2="940" y2="528" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)"/><text x="940" y="572" text-anchor="middle" fill="#253746">飞到新视角 → 获得新扫描 → 再选目标</text></g>
<g id="p14-footer" data-pptx-bounds="52 661 1176 30"><line x1="52" y1="660" x2="1228" y2="660" stroke="#D3DEE5"/><text x="52" y="686" font-size="16" fill="#617382">自主探索 · 不读取货架真值作为选路先验</text><text x="1228" y="686" text-anchor="end" font-size="16" fill="#617382">14 / 22</text></g>
</svg>
