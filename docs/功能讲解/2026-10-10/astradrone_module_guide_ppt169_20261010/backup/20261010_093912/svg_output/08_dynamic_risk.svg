<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" data-pptx-page-role="content">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#168B80"/></marker></defs>
<g id="p08-bg" data-pptx-bounds="0 0 1280 720" data-pptx-role="background"><rect width="1280" height="720" fill="#F7F9FB"/></g>
<g id="p08-title" data-pptx-bounds="52 42 1176 120"><text x="52" y="92" font-size="42" font-weight="bold" fill="#16334A">动态风险：判断物体会不会靠近</text><text x="52" y="145" font-size="28" fill="#617382">不仅看现在多近，还看双方未来短时间会怎样接近。</text></g>
<g id="p08-body" data-pptx-bounds="52 206 548 424"><text x="52" y="238" font-size="28" fill="#16334A">作用：提前发现相遇风险</text><text x="52" y="286" fill="#253746"><tspan x="52">把目标速度减去无人机速度，</tspan><tspan x="52" dy="36">判断短时最近距离与相遇时间。</tspan><tspan x="52" dy="36">同时检查高度上是否可能接近。</tspan></text><text x="52" y="429" font-size="28" fill="#16334A">规则：当前距离 + 短时预测</text><text x="52" y="477" fill="#253746"><tspan x="52">预测范围1.5秒，普通水平距离</tspan><tspan x="52" dy="36">为1.35米；更近或即将近距离</tspan><tspan x="52" dy="36">接近时，进入紧急等级。</tspan><tspan x="52" dy="36">保持和退出门槛减少反复切换。</tspan></text><text x="52" y="621" font-size="18" fill="#D67B29">主要基于目标中心，不是完整人体轮廓的精确碰撞计算。</text></g>
<g id="p08-flow" data-pptx-bounds="654 206 574 412"><rect x="654" y="206" width="574" height="412" rx="12" fill="#EAF3F2"/><rect x="692" y="230" width="498" height="58" rx="12" fill="#FFFFFF"/><text x="941" y="269" text-anchor="middle" fill="#253746">无人机与目标的位置、速度</text><line x1="941" y1="294" x2="941" y2="319" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)"/><rect x="692" y="328" width="498" height="58" rx="12" fill="#FFFFFF"/><text x="941" y="367" text-anchor="middle" fill="#253746">相对运动 → 短时最近距离与高度</text><line x1="941" y1="392" x2="941" y2="420" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)"/><rect x="692" y="430" width="498" height="58" rx="12" fill="#FFFFFF"/><text x="941" y="469" text-anchor="middle" fill="#253746">比较距离、时间及退出条件</text><line x1="941" y1="494" x2="941" y2="521" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)"/><rect x="692" y="532" width="498" height="58" rx="12" fill="#D67B29"/><text x="941" y="571" text-anchor="middle" fill="#FFFFFF">输出风险等级与避让方向</text></g>
<g id="p08-footer" data-pptx-bounds="52 661 1176 30"><line x1="52" y1="660" x2="1228" y2="660" stroke="#D3DEE5"/><text x="52" y="686" font-size="16" fill="#617382">动态风险 · 目标位置与速度直接参与计算</text><text x="1228" y="686" text-anchor="end" font-size="16" fill="#617382">08 / 22</text></g>
</svg>
