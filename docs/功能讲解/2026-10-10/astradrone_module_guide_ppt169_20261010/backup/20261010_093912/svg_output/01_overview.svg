<g id="p01-title" data-pptx-bounds="52 68 730 240"><text x="52" y="96" font-size="18" fill="#168B80">无人机项目 · 功能与运行规则</text><text x="52" y="184" font-size="56" font-weight="bold" fill="#16334A"><tspan x="52">看清环境，</tspan><tspan x="52" dy="78">更新地图，安全飞行</tspan></text></g>
<g id="p01-copy" data-pptx-bounds="52 340 620 240"><text x="52" y="378" font-size="28" fill="#16334A">每个模块做什么，又按什么规则工作？</text><text x="52" y="436" fill="#253746"><tspan x="52">从定位、感知、地图维护，到选路与飞行。</tspan><tspan x="52" dy="36">逐个解释作用和判断依据，</tspan><tspan x="52" dy="36">再把各模块连接成一个完整的运行流程。</tspan></text><text x="52" y="572" font-size="18" fill="#617382">依据当前源码整理 · 流程是机制示意，不是性能实验</text></g>
<g id="p01-flow" data-pptx-bounds="806 130 420 470"><rect x="806" y="130" width="420" height="470" rx="12" fill="#EAF3F2"/><text x="1016" y="184" text-anchor="middle" font-size="28" fill="#16334A">观测 → 决策 → 行动</text><rect x="864" y="224" width="304" height="64" rx="12" fill="#FFFFFF"/><text x="1016" y="265" text-anchor="middle" fill="#253746">位置与环境观测</text><line x1="1016" y1="294" x2="1016" y2="321" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)"/><rect x="864" y="329" width="304" height="64" rx="12" fill="#FFFFFF"/><text x="1016" y="370" text-anchor="middle" fill="#253746">更新地图 · 选路 · 安全</text><line x1="1016" y1="399" x2="1016" y2="426" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)"/><rect x="864" y="434" width="304" height="64" rx="12" fill="#168B80"/><text x="1016" y="475" text-anchor="middle" fill="#FFFFFF">执行飞行，获得新观测</text><text x="1016" y="555" text-anchor="middle" font-size="18" fill="#617382">飞行会改变视角，下一轮判断随之更新</text></g>
