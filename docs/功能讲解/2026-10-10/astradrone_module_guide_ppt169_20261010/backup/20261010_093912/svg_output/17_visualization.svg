<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" data-pptx-page-role="content">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#168B80"/></marker></defs>
<g id="p17-bg" data-pptx-bounds="0 0 1280 720" data-pptx-role="background"><rect width="1280" height="720" fill="#F7F9FB"/></g>
<g id="p17-title" data-pptx-bounds="52 42 1176 120"><text x="52" y="92" font-size="42" font-weight="bold" fill="#16334A">可视化：区分地图、路线和目标球</text><text x="52" y="145" font-size="28" fill="#617382">显示是观察窗口，不是另一个决策器。</text></g>
<g id="p17-body" data-pptx-bounds="52 206 548 424"><text x="52" y="238" font-size="28" fill="#16334A">作用：把中间判断变得看得见</text><text x="52" y="286" fill="#253746"><tspan x="52">点云显示实际扫描或维护地图。</tspan><tspan x="52" dy="36">已飞轨迹说明走过哪里，</tspan><tspan x="52" dy="36">规划路线说明准备怎么走。</tspan></text><text x="52" y="429" font-size="28" fill="#16334A">规则：每种标记都有自己的含义</text><text x="52" y="477" fill="#253746"><tspan x="52">目标球显示跟踪中心，不是实体。</tspan><tspan x="52" dy="36">蓝色方块是探索候选标记，</tspan><tspan x="52" dy="36">不是雷达真的扫出大方块。</tspan><tspan x="52" dy="36">标记及时过期，轨迹有最大长度。</tspan></text><text x="52" y="621" font-size="18" fill="#D67B29">看不到目标球，不足以证明感知程序停止运行。</text></g>
<g id="p17-flow" data-pptx-bounds="654 206 574 412"><rect x="654" y="206" width="574" height="412" rx="12" fill="#EAF3F2"/><text x="696" y="256" font-size="18" fill="#617382">实际消息来源</text><text x="990" y="256" font-size="18" fill="#617382">显示对象</text><text x="696" y="323" fill="#253746">当前扫描 / 维护地图</text><line x1="941" y1="314" x2="978" y2="314" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)"/><text x="996" y="323" fill="#16334A">环境点云</text><text x="696" y="405" fill="#253746">位置 / 规划航点</text><line x1="941" y1="396" x2="978" y2="396" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)"/><text x="996" y="405" fill="#16334A">航迹与路线</text><text x="696" y="487" fill="#253746">跟踪 / 探索候选</text><line x1="941" y1="478" x2="978" y2="478" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)"/><text x="996" y="487" fill="#16334A">球与方块标记</text><text x="941" y="580" text-anchor="middle" font-size="18" fill="#617382">显示按来源分别更新，不把不同对象混为同一地图</text></g>
<g id="p17-footer" data-pptx-bounds="52 661 1176 30"><line x1="52" y1="660" x2="1228" y2="660" stroke="#D3DEE5"/><text x="52" y="686" font-size="16" fill="#617382">显示配置与标记发布 · RViz</text><text x="1228" y="686" text-anchor="end" font-size="16" fill="#617382">17 / 22</text></g>
</svg>
