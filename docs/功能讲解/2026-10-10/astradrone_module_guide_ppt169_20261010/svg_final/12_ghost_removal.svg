<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" data-pptx-page-role="content">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#168B80" /></marker></defs>
<g id="p12-bg" data-pptx-bounds="0 0 1280 720" data-pptx-role="background"><rect width="1280" height="720" fill="#F7F9FB" /></g>
<g id="p12-title" data-pptx-bounds="52 42 1176 120"><text x="52" y="92" font-size="42" font-weight="bold" fill="#16334A">鬼影清理：有“已空”证据才撤销</text><text x="52" y="145" font-size="28" fill="#617382">人离开后，扫描看穿原位置，才支持删除旧占用。</text></g>
<g id="p12-body" data-pptx-bounds="52 206 548 429"><text x="52" y="238" font-size="28" fill="#16334A">作用：让旧障碍可以被重新审视</text><text fill="#253746" x="52" y="286">用匹配时刻的雷达原点发出射线，</text><text fill="#253746" x="52" y="322">只把确实看通的空间作为清空证据。</text><text fill="#253746" x="52" y="358">被挡住、没扫到，不算已经空了。</text><text x="52" y="429" font-size="28" fill="#16334A">规则：保护端点，累积重复证据</text><text fill="#253746" x="52" y="477">当前新表面附近保护不误删。</text><text fill="#253746" x="52" y="513">普通占用连续3次、稳定占用6次</text><text fill="#253746" x="52" y="549">清空证据成立后，才撤销旧点。</text><text fill="#253746" x="52" y="585">探索模式不按人体外形直接抹点。</text><text x="52" y="621" font-size="18" fill="#D67B29">静止的人仍真实占据空间，不能为了好看把当前人体删掉。</text></g>
<g id="p12-flow" data-pptx-bounds="654 206 574 412"><rect x="654" y="206" width="574" height="412" rx="12" fill="#EAF3F2" /><rect x="692" y="230" width="498" height="58" rx="12" fill="#FFFFFF" /><text x="941" y="269" text-anchor="middle" fill="#253746">当前扫描 + 正确时刻与雷达原点</text><line x1="941" y1="294" x2="941" y2="319" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)" /><rect x="692" y="328" width="498" height="58" rx="12" fill="#FFFFFF" /><text x="941" y="367" text-anchor="middle" fill="#253746">射线是否实际看通旧位置？</text><line x1="826" y1="392" x2="799" y2="435" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)" /><line x1="1060" y1="392" x2="1101" y2="435" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)" /><rect x="684" y="448" width="242" height="95" rx="12" fill="#168B80" /><text text-anchor="middle" fill="#FFFFFF" x="805" y="485">是：重复证据足够</text><text text-anchor="middle" fill="#FFFFFF" x="805" y="520">撤销旧占用</text><rect x="950" y="448" width="242" height="95" rx="12" fill="#FFFFFF" /><text text-anchor="middle" fill="#253746" x="1071" y="485">否：被挡或没扫到</text><text text-anchor="middle" fill="#253746" x="1071" y="520">保留旧占用</text><text x="941" y="592" text-anchor="middle" font-size="18" fill="#617382">地图改变后，下一轮路线会重新评估</text></g>
<g id="p12-footer" data-pptx-bounds="52 661 1176 30"><line x1="52" y1="660" x2="1228" y2="660" stroke="#D3DEE5" /><text x="52" y="686" font-size="16" fill="#617382">可见自由空间证据 · 阈值为当前地图配置</text><text x="1228" y="686" text-anchor="end" font-size="16" fill="#617382">12 / 22</text></g>
</svg>