<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" data-pptx-page-role="content">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#168B80" /></marker></defs>
<g id="p13-bg" data-pptx-bounds="0 0 1280 720" data-pptx-role="background"><rect width="1280" height="720" fill="#F7F9FB" /></g>
<g id="p13-title" data-pptx-bounds="52 42 1176 120"><text x="52" y="92" font-size="42" font-weight="bold" fill="#16334A">指定目标规划：地图变化后重新找路</text><text x="52" y="145" font-size="28" fill="#617382">先选择绕障路线，再让局部变化影响下一段路。</text></g>
<g id="p13-body" data-pptx-bounds="52 206 548 429"><text x="52" y="238" font-size="28" fill="#16334A">作用：不只躲开，还要抵达目标</text><text fill="#253746" x="52" y="286">在飞行高度的空间网格中找路。</text><text fill="#253746" x="52" y="322">稳定地图提供长期结构，</text><text fill="#253746" x="52" y="358">自由证据与局部占用修正旧信息。</text><text x="52" y="429" font-size="28" fill="#16334A">规则：留余量，不切角，少抖动</text><text fill="#253746" x="52" y="477">障碍周围扩大禁行区域后搜索。</text><text fill="#253746" x="52" y="513">局部失败时扩大到4、8、12米。</text><text fill="#253746" x="52" y="549">旧路安全时，新路明显更优才切换。</text><text fill="#253746" x="52" y="585">只发安全可见的下一航点。</text><text x="52" y="621" font-size="18" fill="#D67B29">这是固定飞行高度选路，不是任意三维上下绕行。</text></g>
<g id="p13-flow" data-pptx-bounds="654 206 574 412"><rect x="654" y="206" width="574" height="412" rx="12" fill="#EAF3F2" /><rect x="692" y="230" width="498" height="58" rx="12" fill="#FFFFFF" /><text x="941" y="269" text-anchor="middle" fill="#253746">当前位置 + 目标 + 稳定地图</text><line x1="941" y1="294" x2="941" y2="319" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)" /><rect x="692" y="328" width="498" height="58" rx="12" fill="#FFFFFF" /><text x="941" y="367" text-anchor="middle" fill="#253746">清空旧占用，补入局部新障碍</text><line x1="941" y1="392" x2="941" y2="420" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)" /><rect x="692" y="430" width="498" height="58" rx="12" fill="#FFFFFF" /><text x="941" y="469" text-anchor="middle" fill="#253746">扩大障碍边界 → 找路 → 评估旧路</text><line x1="941" y1="494" x2="941" y2="521" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)" /><rect x="692" y="532" width="498" height="58" rx="12" fill="#168B80" /><text x="941" y="571" text-anchor="middle" fill="#FFFFFF">更新路线，发布可见的下一航点</text></g>
<g id="p13-footer" data-pptx-bounds="52 661 1176 30"><line x1="52" y1="660" x2="1228" y2="660" stroke="#D3DEE5" /><text x="52" y="686" font-size="16" fill="#617382">指定目标导航 · 启用自主探索时关闭此规划器</text><text x="1228" y="686" text-anchor="end" font-size="16" fill="#617382">13 / 22</text></g>
</svg>