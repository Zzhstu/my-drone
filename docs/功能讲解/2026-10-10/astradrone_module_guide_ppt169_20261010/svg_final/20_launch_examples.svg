<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" data-pptx-page-role="content">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#168B80" /></marker></defs>
<g id="p20-bg" data-pptx-bounds="0 0 1280 720" data-pptx-role="background"><rect width="1280" height="720" fill="#F7F9FB" /></g>
<g id="p20-title" data-pptx-bounds="52 42 1176 120"><text x="52" y="92" font-size="42" font-weight="bold" fill="#16334A">演示与飞行示例：只保留一个指挥者</text><text x="52" y="145" font-size="28" fill="#617382">启动脚本组织程序，不替代感知、规划或控制算法。</text></g>
<g id="p20-body" data-pptx-bounds="52 206 548 429"><text x="52" y="238" font-size="28" fill="#16334A">作用：把一个任务所需程序装配好</text><text fill="#253746" x="52" y="286">脚本准备仿真与运行环境，</text><text fill="#253746" x="52" y="322">启动定位、避障和选定的任务，</text><text fill="#253746" x="52" y="358">并组织录制、日志和地图保存。</text><text x="52" y="429" font-size="28" fill="#16334A">规则：目标导航与探索互斥选路</text><text fill="#253746" x="52" y="477">探索时关闭通用路径规划器，</text><text fill="#253746" x="52" y="513">避免两个程序同时发下一航点。</text><text fill="#253746" x="52" y="549">键盘、定点与预设航线是独立示例，</text><text fill="#253746" x="52" y="585">不要和主演示同时控制同一架飞机。</text><text x="52" y="621" font-size="18" fill="#D67B29">飞行示例源码在MissionControl；主避障逻辑在SLAM目录。</text></g>
<g id="p20-flow" data-pptx-bounds="654 206 574 412"><rect x="654" y="206" width="574" height="412" rx="12" fill="#EAF3F2" /><rect x="734" y="233" width="414" height="59" rx="12" fill="#168B80" /><text x="941" y="273" text-anchor="middle" fill="#FFFFFF">演示入口：选择一个任务</text><line x1="836" y1="298" x2="794" y2="335" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)" /><line x1="1046" y1="298" x2="1088" y2="335" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)" /><rect x="686" y="347" width="238" height="92" rx="12" fill="#FFFFFF" /><text text-anchor="middle" fill="#253746" x="805" y="384">指定目标导航</text><text text-anchor="middle" fill="#253746" x="805" y="416" font-size="18">通用规划器发航点</text><rect x="958" y="347" width="238" height="92" rx="12" fill="#FFFFFF" /><text text-anchor="middle" fill="#253746" x="1077" y="384">仓库自主探索</text><text text-anchor="middle" fill="#253746" x="1077" y="416" font-size="18">探索器发航点</text><line x1="805" y1="445" x2="880" y2="478" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)" /><line x1="1077" y1="445" x2="1001" y2="478" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)" /><text x="941" y="519" text-anchor="middle" fill="#16334A">共用感知、地图、安全判断与控制</text><text x="941" y="582" text-anchor="middle" font-size="18" fill="#D67B29">独立键盘 / 定点 / 预设航线示例，另选一条控制链</text></g>
<g id="p20-footer" data-pptx-bounds="52 661 1176 30"><line x1="52" y1="660" x2="1228" y2="660" stroke="#D3DEE5" /><text x="52" y="686" font-size="16" fill="#617382">任务装配与独立飞行示例的边界</text><text x="1228" y="686" text-anchor="end" font-size="16" fill="#617382">20 / 22</text></g>
</svg>