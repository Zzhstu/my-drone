<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" data-pptx-page-role="content">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#168B80" /></marker></defs>
<g id="p04-bg" data-pptx-bounds="0 0 1280 720" data-pptx-role="background"><rect width="1280" height="720" fill="#F7F9FB" /></g>
<g id="p04-title" data-pptx-bounds="52 42 1176 120"><text x="52" y="92" font-size="42" font-weight="bold" fill="#16334A">坐标衔接：让位置、点云与控制一致</text><text x="52" y="145" font-size="28" fill="#617382">所有模块都要用同一种“位置语言”。</text></g>
<g id="p04-body" data-pptx-bounds="52 206 548 413"><text x="52" y="238" font-size="28" fill="#16334A">作用：避免方向和原点不一致</text><text fill="#253746" x="52" y="286">定位程序与飞控的原点可能不同。</text><text fill="#253746" x="52" y="322">衔接程序真正旋转、平移数据，</text><text fill="#253746" x="52" y="358">使位置与扫描进入统一参考系。</text><text x="52" y="429" font-size="28" fill="#16334A">规则：初始对齐一次，之后独立更新</text><text fill="#253746" x="52" y="477">开头借助飞控位置建立转换。</text><text fill="#253746" x="52" y="513">之后由每帧激光定位驱动输出，</text><text fill="#253746" x="52" y="549">并记录有长度限制的已飞航迹。</text><text x="52" y="612" font-size="18" fill="#D67B29">主演示不把对齐后位置再回灌飞控，避免循环依赖。</text></g>
<g id="p04-flow" data-pptx-bounds="654 206 574 409"><rect x="654" y="206" width="574" height="409" rx="12" fill="#EAF3F2" /><rect x="692" y="231" width="498" height="61" rx="12" fill="#FFFFFF" /><text x="941" y="272" text-anchor="middle" fill="#253746">初始定位 + 飞控位置</text><line x1="941" y1="297" x2="941" y2="323" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)" /><rect x="692" y="331" width="498" height="61" rx="12" fill="#FFFFFF" /><text x="941" y="372" text-anchor="middle" fill="#253746">建立一次坐标转换</text><line x1="941" y1="397" x2="941" y2="423" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)" /><rect x="692" y="431" width="498" height="61" rx="12" fill="#168B80" /><text x="941" y="472" text-anchor="middle" fill="#FFFFFF">每帧位置与扫描统一转换</text><line x1="864" y1="498" x2="806" y2="532" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)" /><line x1="1020" y1="498" x2="1077" y2="532" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)" /><text x="806" y="572" text-anchor="middle" fill="#253746">感知、规划与控制</text><text x="1077" y="572" text-anchor="middle" fill="#253746">记录已飞航迹</text></g>
<g id="p04-footer" data-pptx-bounds="52 661 1176 30"><line x1="52" y1="660" x2="1228" y2="660" stroke="#D3DEE5" /><text x="52" y="686" font-size="16" fill="#617382">位置衔接与点云衔接</text><text x="1228" y="686" text-anchor="end" font-size="16" fill="#617382">04 / 22</text></g>
</svg>