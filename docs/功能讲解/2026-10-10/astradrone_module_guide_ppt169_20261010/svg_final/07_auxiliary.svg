<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" data-pptx-page-role="content">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#168B80" /></marker></defs>
<g id="p07-bg" data-pptx-bounds="0 0 1280 720" data-pptx-role="background"><rect width="1280" height="720" fill="#F7F9FB" /></g>
<g id="p07-title" data-pptx-bounds="52 42 1176 120"><text x="52" y="92" font-size="42" font-weight="bold" fill="#16334A">辅助接口：短时预测与类别转发</text><text x="52" y="145" font-size="28" fill="#617382">这两条是辅助支路，不要误说为主避障必经的识别网络。</text></g>
<g id="p07-prose" data-pptx-bounds="52 206 548 427"><text x="52" y="238" font-size="28" fill="#16334A">短时预测：沿当前速度向前推</text><text fill="#253746" x="52" y="286">假设短时间内速度不变，</text><text fill="#253746" x="52" y="322">推算0.5秒后的辅助位置。</text><text fill="#253746" x="52" y="358">转身、加速或停下会让预测失准。</text><text x="52" y="429" font-size="28" fill="#16334A">类别接口：默认原样转发</text><text fill="#253746" x="52" y="477">默认不做图像类别关联。</text><text fill="#253746" x="52" y="513">开启并有图像框、相机与转换，</text><text fill="#253746" x="52" y="549">才尝试给三维目标附上类别。</text><text fill="#253746" x="52" y="585">接口本身不运行人体识别网络。</text><text x="52" y="621" font-size="18" fill="#D67B29">主碰撞判断直接用目标位置与速度，自行判断双方接近。</text></g>
<g id="p07-flow" data-pptx-bounds="654 206 574 412"><rect x="654" y="206" width="574" height="412" rx="12" fill="#EAF3F2" /><rect x="804" y="236" width="274" height="62" rx="12" fill="#168B80" /><text x="941" y="277" text-anchor="middle" fill="#FFFFFF">跟踪目标：位置与速度</text><line x1="834" y1="304" x2="774" y2="359" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)" /><line x1="1048" y1="304" x2="1108" y2="359" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)" /><rect x="684" y="371" width="242" height="104" rx="12" fill="#FFFFFF" /><text text-anchor="middle" fill="#253746" x="805" y="409">短时位置预测</text><text text-anchor="middle" fill="#253746" x="805" y="444" font-size="18">辅助预测，不替代风险判断</text><rect x="952" y="371" width="242" height="104" rx="12" fill="#FFFFFF" /><text text-anchor="middle" fill="#253746" x="1073" y="409">类别转发接口</text><text text-anchor="middle" fill="#253746" x="1073" y="444" font-size="18">主演示默认原样转发</text><text x="941" y="556" text-anchor="middle" fill="#16334A">主安全链读取当前位置和速度</text><text x="941" y="590" text-anchor="middle" font-size="18" fill="#617382">不要因消息名称含类别就声称已识别人</text></g>
<g id="p07-footer" data-pptx-bounds="52 661 1176 30"><line x1="52" y1="660" x2="1228" y2="660" stroke="#D3DEE5" /><text x="52" y="686" font-size="16" fill="#617382">辅助支路及当前启用状态</text><text x="1228" y="686" text-anchor="end" font-size="16" fill="#617382">07 / 22</text></g>
</svg>