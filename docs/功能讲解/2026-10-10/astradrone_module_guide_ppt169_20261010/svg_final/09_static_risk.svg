<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" data-pptx-page-role="content">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#168B80" /></marker></defs>
<g id="p09-bg" data-pptx-bounds="0 0 1280 720" data-pptx-role="background"><rect width="1280" height="720" fill="#F7F9FB" /></g>
<g id="p09-title" data-pptx-bounds="52 42 1176 120"><text x="52" y="92" font-size="42" font-weight="bold" fill="#16334A">静态风险：最新扫描检查附近净空</text><text x="52" y="145" font-size="28" fill="#617382">地图选出的路线，仍需用当下扫描检查周围是否够宽。</text></g>
<g id="p09-body" data-pptx-bounds="52 206 548 424"><text x="52" y="238" font-size="28" fill="#16334A">作用：检查当下近场空间</text><text fill="#253746" x="52" y="286">只看飞行高度附近的新扫描。</text><text fill="#253746" x="52" y="322">检查邻域支持，削弱孤立噪点，</text><text fill="#253746" x="52" y="358">已跟踪动态目标附近作短时遮罩。</text><text x="52" y="429" font-size="28" fill="#16334A">规则：自身半径 + 额外余量</text><text fill="#253746" x="52" y="477">仓库配置自身半径0.40米，</text><text fill="#253746" x="52" y="513">安全余量0.30米，合计0.70米。</text><text fill="#253746" x="52" y="549">紧急与退出分别合计0.65、0.75米，</text><text fill="#253746" x="52" y="585">让触发与退出不在同一条线上。</text><text x="52" y="621" font-size="18" fill="#D67B29">这是近场风险距离；不能代替规划网格的全部安全规则。</text></g>
<g id="p09-flow" data-pptx-bounds="654 206 574 412"><rect x="654" y="206" width="574" height="412" rx="12" fill="#EAF3F2" /><rect x="692" y="230" width="498" height="58" rx="12" fill="#FFFFFF" /><text x="941" y="269" text-anchor="middle" fill="#253746">当前扫描 + 当前无人机位置</text><line x1="941" y1="294" x2="941" y2="319" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)" /><rect x="692" y="328" width="498" height="58" rx="12" fill="#FFFFFF" /><text x="941" y="367" text-anchor="middle" fill="#253746">高度筛选、邻域支持、动态遮罩</text><line x1="941" y1="392" x2="941" y2="420" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)" /><rect x="692" y="430" width="498" height="58" rx="12" fill="#FFFFFF" /><text x="941" y="469" text-anchor="middle" fill="#253746">估计周围净空，与尺寸和余量比较</text><line x1="941" y1="494" x2="941" y2="521" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)" /><rect x="692" y="532" width="498" height="58" rx="12" fill="#D67B29" /><text x="941" y="571" text-anchor="middle" fill="#FFFFFF">输出静态风险及远离障碍的方向</text></g>
<g id="p09-footer" data-pptx-bounds="52 661 1176 30"><line x1="52" y1="660" x2="1228" y2="660" stroke="#D3DEE5" /><text x="52" y="686" font-size="16" fill="#617382">静态风险 · 数值为当前仓库配置</text><text x="1228" y="686" text-anchor="end" font-size="16" fill="#617382">09 / 22</text></g>
</svg>