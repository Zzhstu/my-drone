<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" data-pptx-page-role="content">
<g id="p02-bg" data-pptx-bounds="0 0 1280 720" data-pptx-role="background"><rect width="1280" height="720" fill="#F7F9FB" /></g>
<g id="p02-title" data-pptx-bounds="52 42 1176 118"><text x="52" y="92" font-size="42" font-weight="bold" fill="#16334A">功能包与模块：谁负责哪件事</text><text x="52" y="145" font-size="28" fill="#617382">功能包是工具箱，内部程序是各司其职的小工具。</text></g>
<g id="p02-explain" data-pptx-bounds="52 208 450 400"><text x="52" y="243" font-size="28" fill="#16334A">先纠正一个容易混淆的地方</text><text fill="#253746" x="52" y="292">上一轮列出的多个避障文件，</text><text fill="#253746" x="52" y="328">大多属于同一个衔接与避障包，</text><text fill="#253746" x="52" y="364">并不是每个文件都独立成包。</text><text fill="#253746" x="52" y="420">主演示调用地图、规划和控制链；</text><text fill="#253746" x="52" y="456">键盘和预设航线则是独立示例，</text><text fill="#253746" x="52" y="492">不能同时争抢无人机的指令。</text><text x="52" y="590" font-size="18" fill="#D67B29">本次按功能讲解，同时在备注保留准确包名与文件。</text></g>
<g id="p02-map" data-pptx-bounds="550 205 678 407"><rect x="550" y="205" width="678" height="407" rx="12" fill="#EAF3F2" /><line x1="578" y1="303" x2="1200" y2="303" stroke="#D3DEE5" /><line x1="578" y1="404" x2="1200" y2="404" stroke="#D3DEE5" /><line x1="578" y1="505" x2="1200" y2="505" stroke="#D3DEE5" /><text x="580" y="251" font-size="28" fill="#16334A">定位建图包</text><text x="850" y="251" fill="#253746">估计位置，整理当前扫描</text><text x="580" y="279" font-size="18" fill="#617382">FAST_LIO</text><text x="580" y="352" font-size="28" fill="#16334A">衔接与避障包</text><text x="850" y="352" fill="#253746">感知、地图、选路、控制</text><text x="580" y="380" font-size="18" fill="#617382">fastlio_bridge</text><text x="580" y="453" font-size="28" fill="#16334A">飞行示例包</text><text x="850" y="453" fill="#253746">键盘、定点、预设航线</text><text x="580" y="481" font-size="18" fill="#617382">offboard</text><text x="580" y="554" font-size="28" fill="#16334A">仿真相关包</text><text x="850" y="554" fill="#253746">仓库、雷达、无人机与人</text><text x="580" y="582" font-size="18" fill="#617382">提供环境，不向探索器预告货架布局</text></g>
<g id="p02-footer" data-pptx-bounds="52 661 1176 30"><line x1="52" y1="660" x2="1228" y2="660" stroke="#D3DEE5" /><text x="52" y="686" font-size="16" fill="#617382">职责划分 · 完整源码路径见讲稿备注</text><text x="1228" y="686" text-anchor="end" font-size="16" fill="#617382">02 / 22</text></g>
