<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" data-pptx-page-role="content">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#168B80" /></marker></defs>
<g id="p06-bg" data-pptx-bounds="0 0 1280 720" data-pptx-role="background"><rect width="1280" height="720" fill="#F7F9FB" /></g>
<g id="p06-title" data-pptx-bounds="52 42 1176 120"><text x="52" y="92" font-size="42" font-weight="bold" fill="#16334A">连续跟踪：多次证据才确认运动</text><text x="52" y="145" font-size="28" fill="#617382">先把点组成目标，再判断同一个目标是否持续移动。</text></g>
<g id="p06-body" data-pptx-bounds="52 206 548 428"><text x="52" y="238" font-size="28" fill="#16334A">作用：从“点变了”到“物体在走”</text><text fill="#253746" x="52" y="286">近点成组，用中心代表目标。</text><text fill="#253746" x="52" y="322">与历史目标配对，保留同一编号，</text><text fill="#253746" x="52" y="358">检查合理位移，避免串错目标。</text><text x="52" y="429" font-size="28" fill="#16334A">规则：连续证据 + 静态支持</text><text fill="#253746" x="52" y="477">速度、位移、方向等条件共同判断，</text><text fill="#253746" x="52" y="513">当前要求连续4次运动条件成立。</text><text fill="#253746" x="52" y="549">稳定地图支持充分时否决动态。</text><text fill="#253746" x="52" y="585">显示平滑与运动历史分别处理。</text><text x="52" y="621" font-size="18" fill="#D67B29">减少静态误报的保护，也可能压制真实运动，需评价漏检。</text></g>
<g id="p06-flow" data-pptx-bounds="654 206 574 412"><rect x="654" y="206" width="574" height="412" rx="12" fill="#EAF3F2" /><rect x="692" y="230" width="498" height="55" rx="12" fill="#FFFFFF" /><text x="941" y="267" text-anchor="middle" fill="#253746">前景点 → 组成目标 → 历史配对</text><line x1="941" y1="291" x2="941" y2="319" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)" /><rect x="692" y="328" width="238" height="74" rx="12" fill="#FFFFFF" /><text text-anchor="middle" fill="#253746" x="811" y="358">连续运动证据</text><text text-anchor="middle" fill="#253746" x="811" y="387" font-size="18">速度、位移、方向</text><rect x="952" y="328" width="238" height="74" rx="12" fill="#FFFFFF" /><text text-anchor="middle" fill="#253746" x="1071" y="358">稳定地图支持</text><text text-anchor="middle" fill="#253746" x="1071" y="387" font-size="18">防止静态表面误报</text><line x1="811" y1="408" x2="888" y2="450" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)" /><line x1="1071" y1="408" x2="993" y2="450" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)" /><rect x="730" y="460" width="422" height="58" rx="12" fill="#168B80" /><text x="941" y="499" text-anchor="middle" fill="#FFFFFF">多次成立才确认，否则继续观察</text><text x="941" y="580" text-anchor="middle" font-size="18" fill="#617382">丢失超过允许帧数会删除，不永久显示旧目标</text></g>
<g id="p06-footer" data-pptx-bounds="52 661 1176 30"><line x1="52" y1="660" x2="1228" y2="660" stroke="#D3DEE5" /><text x="52" y="686" font-size="16" fill="#617382">目标成组、连续跟踪与运动确认</text><text x="1228" y="686" text-anchor="end" font-size="16" fill="#617382">06 / 22</text></g>
</svg>