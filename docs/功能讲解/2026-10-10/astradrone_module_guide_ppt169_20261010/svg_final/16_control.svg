<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" data-pptx-page-role="content">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#168B80" /></marker></defs>
<g id="p16-bg" data-pptx-bounds="0 0 1280 720" data-pptx-role="background"><rect width="1280" height="720" fill="#F7F9FB" /></g>
<g id="p16-title" data-pptx-bounds="52 42 1176 120"><text x="52" y="92" font-size="42" font-weight="bold" fill="#16334A">飞行控制：航点与风险共同决定速度</text><text x="52" y="145" font-size="28" fill="#617382">规划说去哪，控制器决定现在能不能走。</text></g>
<g id="p16-body" data-pptx-bounds="52 206 548 429"><text x="52" y="238" font-size="28" fill="#16334A">作用：把航点变成实际飞行指令</text><text fill="#253746" x="52" y="286">先确认地面稳定，持续发送指令，</text><text fill="#253746" x="52" y="322">再切换飞行模式、解锁与起飞。</text><text fill="#253746" x="52" y="358">按距地面抬升和稳定停留判断起飞。</text><text x="52" y="429" font-size="28" fill="#16334A">规则：逐周期裁决，不盲从航点</text><text fill="#253746" x="52" y="477">正常跟随；一级风险停下等待。</text><text fill="#253746" x="52" y="513">紧急时按任务设置避让或停等，</text><text fill="#253746" x="52" y="549">受检查的短恢复再走安全方向。</text><text fill="#253746" x="52" y="585">必要数据过期则悬停，不继续赶路。</text><text x="52" y="621" font-size="18" fill="#D67B29">探索紧急分支偏向停等与受检查恢复，不等同普通导航。</text></g>
<g id="p16-flow" data-pptx-bounds="654 206 574 412"><rect x="654" y="206" width="574" height="412" rx="12" fill="#EAF3F2" /><rect x="692" y="228" width="498" height="59" rx="12" fill="#FFFFFF" /><text x="941" y="268" text-anchor="middle" fill="#253746">完成准备与起飞 → 接收航点和风险</text><line x1="941" y1="293" x2="941" y2="317" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)" /><rect x="684" y="329" width="242" height="93" rx="12" fill="#FFFFFF" /><text text-anchor="middle" fill="#253746" x="805" y="365">正常且数据新鲜</text><text text-anchor="middle" fill="#253746" x="805" y="399" font-size="18">按航点误差算速度</text><rect x="952" y="329" width="242" height="93" rx="12" fill="#FFFFFF" /><text text-anchor="middle" fill="#D67B29" x="1073" y="365">风险或数据异常</text><text text-anchor="middle" fill="#D67B29" x="1073" y="399" font-size="18">等待、避让或安全恢复</text><line x1="805" y1="428" x2="884" y2="464" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)" /><line x1="1073" y1="428" x2="999" y2="464" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)" /><rect x="718" y="475" width="446" height="58" rx="12" fill="#FFFFFF" /><text x="941" y="514" text-anchor="middle" fill="#253746">速度限幅 + 最新扫描检查</text><line x1="941" y1="539" x2="941" y2="557" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)" /><text x="941" y="595" text-anchor="middle" fill="#16334A">发送指令 → 飞控执行底层姿态与动力控制</text></g>
<g id="p16-footer" data-pptx-bounds="52 661 1176 30"><line x1="52" y1="660" x2="1228" y2="660" stroke="#D3DEE5" /><text x="52" y="686" font-size="16" fill="#617382">主演示控制器 · 不是独立键盘飞行示例</text><text x="1228" y="686" text-anchor="end" font-size="16" fill="#617382">16 / 22</text></g>
</svg>