<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" data-pptx-page-role="content">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#168B80" /></marker></defs>
<g id="p05-bg" data-pptx-bounds="0 0 1280 720" data-pptx-role="background"><rect width="1280" height="720" fill="#F7F9FB" /><rect x="654" y="206" width="574" height="410" rx="12" fill="#EAF3F2" /></g>
<g id="p05-title" data-pptx-bounds="52 42 1176 120"><text x="52" y="92" font-size="42" font-weight="bold" fill="#16334A">前景候选：先找与开头不一样的点</text><text x="52" y="145" font-size="28" fill="#617382">与背景不同，只是候选，不代表物体一定在走。</text></g>
<g id="p05-body" data-pptx-bounds="52 206 548 423"><text x="52" y="238" font-size="28" fill="#16334A">作用：缩小后续判断的范围</text><text fill="#253746" x="52" y="286">先收集开头40帧作为背景。</text><text fill="#253746" x="52" y="322">后续扫描按小空间格压缩，</text><text fill="#253746" x="52" y="358">只保留近场和合适高度的点。</text><text x="52" y="429" font-size="28" fill="#16334A">规则：比较小格及其附近背景</text><text fill="#253746" x="52" y="477">已有背景不送入前景候选。</text><text fill="#253746" x="52" y="513">新看到的静止货架也可能入选。</text><text fill="#253746" x="52" y="549">当前关闭永久在线背景吸收，</text><text fill="#253746" x="52" y="585">避免短暂停留的人被永久吸收。</text><text x="52" y="621" font-size="18" fill="#D67B29">开头不动的人也可能成为背景；这不是人体识别器。</text></g>
<g id="p05-field" data-pptx-bounds="722 232 466 113"><rect x="722" y="232" width="466" height="66" rx="12" fill="#FFFFFF" /><text x="955" y="274" text-anchor="middle" fill="#253746">当前扫描 → 压缩并筛选近场</text><line x1="955" y1="304" x2="955" y2="341" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)" /></g>
<g id="p05-decision" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="flowChartDecision" data-pptx-frame="835 350 240 110" fill="#EAF3F2" stroke="#168B80" stroke-width="2">
<path d="M 835 405 L 955 350 L 1075 405 L 955 460 Z" />
</g>
<g id="p05-branches" data-pptx-bounds="687 388 526 218"><text x="955" y="413" text-anchor="middle" font-size="18" fill="#16334A">背景已有？</text><line x1="830" y1="405" x2="781" y2="510" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)" /><line x1="1080" y1="405" x2="1130" y2="510" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)" /><text x="763" y="467" font-size="18" fill="#617382">是</text><text x="1138" y="467" font-size="18" fill="#617382">否</text><rect x="696" y="521" width="184" height="59" rx="12" fill="#FFFFFF" /><text x="788" y="560" text-anchor="middle" fill="#253746">不输出候选</text><rect x="1010" y="521" width="186" height="59" rx="12" fill="#168B80" /><text x="1103" y="560" text-anchor="middle" fill="#FFFFFF">交给连续跟踪</text></g>
<g id="p05-footer" data-pptx-bounds="52 661 1176 30"><line x1="52" y1="660" x2="1228" y2="660" stroke="#D3DEE5" /><text x="52" y="686" font-size="16" fill="#617382">前景候选提取 · 不直接作动态结论</text><text x="1228" y="686" text-anchor="end" font-size="16" fill="#617382">05 / 22</text></g>
</svg>