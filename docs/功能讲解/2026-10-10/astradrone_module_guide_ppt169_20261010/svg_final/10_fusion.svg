<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" data-pptx-page-role="content">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#168B80" /></marker></defs>
<g id="p10-bg" data-pptx-bounds="0 0 1280 720" data-pptx-role="background"><rect width="1280" height="720" fill="#F7F9FB" /></g>
<g id="p10-title" data-pptx-bounds="52 42 1176 120"><text x="52" y="92" font-size="42" font-weight="bold" fill="#16334A">风险融合：统一等级与避让建议</text><text x="52" y="145" font-size="28" fill="#617382">“风险有多高”和“往哪躲”分开处理。</text></g>
<g id="p10-body" data-pptx-bounds="52 206 548 424"><text x="52" y="238" font-size="28" fill="#16334A">作用：让两路风险有统一出口</text><text fill="#253746" x="52" y="286">动态和静态分别给出风险，</text><text fill="#253746" x="52" y="322">最终等级取两者较高值。</text><text fill="#253746" x="52" y="358">速度建议则按风险组合处理。</text><text x="52" y="429" font-size="28" fill="#16334A">规则：合并、限幅、平滑</text><text fill="#253746" x="52" y="477">双一级建议相加；双二级建议</text><text fill="#253746" x="52" y="513">按动态0.6、静态0.4加权。</text><text fill="#253746" x="52" y="549">方向抵消时优先静态安全方向。</text><text fill="#253746" x="52" y="585">过期来源不参与当前融合。</text><text x="52" y="621" font-size="18" fill="#D67B29">排除过期来源不等于完整失效保护，控制器仍需检查数据。</text></g>
<g id="p10-flow" data-pptx-bounds="654 206 574 412"><rect x="654" y="206" width="574" height="412" rx="12" fill="#EAF3F2" /><rect x="684" y="235" width="239" height="61" rx="12" fill="#FFFFFF" /><text x="803" y="276" text-anchor="middle" fill="#253746">动态风险与方向</text><rect x="959" y="235" width="239" height="61" rx="12" fill="#FFFFFF" /><text x="1078" y="276" text-anchor="middle" fill="#253746">静态风险与方向</text><line x1="803" y1="302" x2="879" y2="342" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)" /><line x1="1078" y1="302" x2="1002" y2="342" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)" /><rect x="718" y="353" width="446" height="96" rx="12" fill="#FFFFFF" /><text text-anchor="middle" fill="#253746" x="941" y="391">等级：取较高值</text><text text-anchor="middle" fill="#253746" x="941" y="427">方向：按等级组合求和或加权</text><line x1="941" y1="455" x2="941" y2="487" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)" /><rect x="718" y="498" width="446" height="61" rx="12" fill="#168B80" /><text x="941" y="539" text-anchor="middle" fill="#FFFFFF">统一风险消息 → 飞行控制器</text><text x="941" y="598" text-anchor="middle" font-size="18" fill="#617382">建议速度还有上限，并经过平滑</text></g>
<g id="p10-footer" data-pptx-bounds="52 661 1176 30"><line x1="52" y1="660" x2="1228" y2="660" stroke="#D3DEE5" /><text x="52" y="686" font-size="16" fill="#617382">风险融合 · 不能简单概括为永远选其中一条速度</text><text x="1228" y="686" text-anchor="end" font-size="16" fill="#617382">10 / 22</text></g>
</svg>