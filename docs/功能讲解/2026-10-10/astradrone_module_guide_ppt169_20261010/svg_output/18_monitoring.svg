<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" data-pptx-page-role="content">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#168B80"/></marker></defs>
<g id="p18-bg" data-pptx-bounds="0 0 1280 720" data-pptx-role="background"><rect width="1280" height="720" fill="#F7F9FB"/></g>
<g id="p18-title" data-pptx-bounds="52 42 1176 120"><text x="52" y="92" font-size="42" font-weight="bold" fill="#16334A">运行监测：分清无目标与没数据</text><text x="52" y="145" font-size="28" fill="#617382">正常空结果与通信停滞，是两种完全不同的状态。</text></g>
<g id="p18-body" data-pptx-bounds="52 206 548 424"><text x="52" y="238" font-size="28" fill="#16334A">作用：帮助定位哪一段不正常</text><text x="52" y="286" fill="#253746"><tspan x="52">观察定位、扫描、目标和风险消息。</tspan><tspan x="52" dy="36">统计接收数量、频率与最新时间，</tspan><tspan x="52" dy="36">让“还有没有在更新”有依据。</tspan></text><text x="52" y="429" font-size="28" fill="#16334A">规则：先检查新鲜度，再看内容</text><text x="52" y="477" fill="#253746"><tspan x="52">持续收到空目标，可能很正常。</tspan><tspan x="52" dy="36">长时间没消息，则需检查上游。</tspan><tspan x="52" dy="36">监测报告负责提示人查看，</tspan><tspan x="52" dy="36">不代替控制器的悬停保护。</tspan></text><text x="52" y="621" font-size="18" fill="#D67B29">诊断正常也不能证明无碰撞或地图完整，还要看任务证据。</text></g>
<g id="p18-flow" data-pptx-bounds="654 206 574 412"><rect x="654" y="206" width="574" height="412" rx="12" fill="#EAF3F2"/><rect x="692" y="230" width="498" height="58" rx="12" fill="#FFFFFF"/><text x="941" y="269" text-anchor="middle" fill="#253746">定位、扫描、目标、风险等消息</text><line x1="941" y1="294" x2="941" y2="319" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)"/><rect x="692" y="328" width="498" height="58" rx="12" fill="#FFFFFF"/><text x="941" y="367" text-anchor="middle" fill="#253746">统计数量、频率与距最新消息时间</text><line x1="825" y1="392" x2="805" y2="433" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)"/><line x1="1060" y1="392" x2="1080" y2="433" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)"/><rect x="684" y="447" width="242" height="96" rx="12" fill="#FFFFFF"/><text x="805" y="483" text-anchor="middle" fill="#168B80"><tspan x="805">更新正常、目标为空</tspan><tspan x="805" dy="35" font-size="18">当前没有目标，不等于停机</tspan></text><rect x="952" y="447" width="242" height="96" rx="12" fill="#FFFFFF"/><text x="1073" y="483" text-anchor="middle" fill="#D67B29"><tspan x="1073">消息长时间未更新</tspan><tspan x="1073" dy="35" font-size="18">检查上游、日志与连接</tspan></text><text x="941" y="592" text-anchor="middle" font-size="18" fill="#617382">输出诊断给人；飞行安全动作由控制器负责</text></g>
<g id="p18-footer" data-pptx-bounds="52 661 1176 30"><line x1="52" y1="660" x2="1228" y2="660" stroke="#D3DEE5"/><text x="52" y="686" font-size="16" fill="#617382">运行监测与数据新鲜度</text><text x="1228" y="686" text-anchor="end" font-size="16" fill="#617382">18 / 22</text></g>
</svg>
