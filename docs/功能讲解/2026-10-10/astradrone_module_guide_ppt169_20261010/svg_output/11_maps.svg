<text x="948" y="353" text-anchor="middle" fill="#FFFFFF">同一份空间格存储</text><line x1="854" y1="414" x2="767" y2="458" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)"/><line x1="948" y1="414" x2="948" y2="458" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)"/><line x1="1038" y1="414" x2="1128" y2="458" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)"/><rect x="686" y="471" width="158" height="100" rx="12" fill="#FFFFFF"/><text x="765" y="507" text-anchor="middle" fill="#253746"><tspan x="765">全局视图</tspan><tspan x="765" dy="35" font-size="18">长期选路</tspan></text><rect x="868" y="471" width="158" height="100" rx="12" fill="#FFFFFF"/><text x="947" y="507" text-anchor="middle" fill="#253746"><tspan x="947">稳定视图</tspan><tspan x="947" dy="35" font-size="18">抑制误报</tspan></text><rect x="1050" y="471" width="158" height="100" rx="12" fill="#FFFFFF"/><text x="1129" y="507" text-anchor="middle" fill="#253746"><tspan x="1129">滚动局部图</tspan><tspan x="1129" dy="35" font-size="18">附近新变化</tspan></text></g>
