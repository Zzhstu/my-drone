<g id="p11-title" data-pptx-bounds="52 42 1176 120"><text x="52" y="92" font-size="42" font-weight="bold" fill="#16334A">地图维护：一份存储，多种用途</text><text x="52" y="145" font-size="28" fill="#617382">不是三张毫无关联的地图，而是同一空间证据的不同视图。</text></g>
<g id="p11-body" data-pptx-bounds="52 206 548 424"><text x="52" y="238" font-size="28" fill="#16334A">作用：兼顾长期选路与近期变化</text><text x="52" y="286" fill="#253746"><tspan x="52">新扫描更新小空间格的占用证据，</tspan><tspan x="52" dy="36">同一存储按不同门槛输出地图。</tspan><tspan x="52" dy="36">观察次数多，不等于永久不可改。</tspan></text><text x="52" y="429" font-size="28" fill="#16334A">规则：根据用途选证据与范围</text><text x="52" y="477" fill="#253746"><tspan x="52">全局图提供长期路线信息。</tspan><tspan x="52" dy="36">稳定图要求更多次观察支持。</tspan><tspan x="52" dy="36">滚动局部图保留附近近期占用，</tspan><tspan x="52" dy="36">让眼前变化影响后续规划。</tspan></text><text x="52" y="621" font-size="18" fill="#D67B29">这里的维护地图，不是FAST-LIO内部匹配使用的树。</text></g>
<g id="p11-flow" data-pptx-bounds="654 206 574 412"><rect x="654" y="206" width="574" height="412" rx="12" fill="#EAF3F2"/><text x="948" y="244" text-anchor="middle" fill="#253746">当前扫描 + 位置 + 可见自由空间证据</text><line x1="948" y1="250" x2="948" y2="270" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)"/>
<g id="p11-store" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="flowChartMagneticDisk" data-pptx-frame="813 279 270 128" fill="#168B80" stroke="none">
