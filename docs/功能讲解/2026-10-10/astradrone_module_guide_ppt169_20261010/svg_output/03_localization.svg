<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" data-pptx-page-role="content">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#168B80"/></marker></defs>
<g id="p03-bg" data-pptx-bounds="0 0 1280 720" data-pptx-role="background"><rect width="1280" height="720" fill="#F7F9FB"/></g>
<g id="p03-title" data-pptx-bounds="52 42 1176 120"><text x="52" y="92" font-size="42" font-weight="bold" fill="#16334A">定位建图：位置不只靠惯性积分</text><text x="52" y="145" font-size="28" fill="#617382">惯性先预测，激光再用环境约束修正。</text></g>
<g id="p03-body" data-pptx-bounds="52 204 554 414"><text x="52" y="236" font-size="28" fill="#16334A">作用：回答“我在哪里”</text><text x="52" y="284" fill="#253746"><tspan x="52">惯性测量预测短时间内的运动。</tspan><tspan x="52" dy="36">新扫描与已有环境表面比较，</tspan><tspan x="52" dy="36">再修正位置、方向和运动状态。</tspan></text><text x="52" y="427" font-size="28" fill="#16334A">规则：不断预测，再不断校正</text><text x="52" y="475" fill="#253746"><tspan x="52">修正后的位置用于整理扫描，</tspan><tspan x="52" dy="36">并更新下一次匹配使用的地图。</tspan><tspan x="52" dy="36">不是只积分，也不是只拼接点云。</tspan></text><text x="52" y="612" font-size="18" fill="#D67B29">当前模拟分支不等同真实雷达的逐点运动补偿。</text></g>
<g id="p03-flow" data-pptx-bounds="654 206 574 408"><rect x="654" y="206" width="574" height="408" rx="12" fill="#EAF3F2"/><rect x="684" y="232" width="228" height="58" rx="12" fill="#FFFFFF"/><text x="798" y="270" text-anchor="middle" fill="#253746">惯性预测</text><rect x="952" y="232" width="246" height="58" rx="12" fill="#FFFFFF"/><text x="1075" y="270" text-anchor="middle" fill="#253746">新扫描 + 已有地图</text><line x1="798" y1="294" x2="877" y2="336" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)"/><line x1="1075" y1="294" x2="1001" y2="336" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)"/><rect x="740" y="345" width="402" height="64" rx="12" fill="#168B80"/><text x="941" y="387" text-anchor="middle" fill="#FFFFFF">比较环境，修正位置与姿态</text><line x1="941" y1="415" x2="941" y2="451" stroke="#168B80" stroke-width="2" marker-end="url(#arrow)"/><rect x="740" y="461" width="402" height="64" rx="12" fill="#FFFFFF"/><text x="941" y="503" text-anchor="middle" fill="#253746">输出位置、当前扫描，更新地图</text><text x="941" y="580" text-anchor="middle" font-size="18" fill="#617382">更新的地图进入下一轮匹配，形成持续校正</text></g>
<g id="p03-footer" data-pptx-bounds="52 661 1176 30"><line x1="52" y1="660" x2="1228" y2="660" stroke="#D3DEE5"/><text x="52" y="686" font-size="16" fill="#617382">定位与原始建图 · FAST-LIO2</text><text x="1228" y="686" text-anchor="end" font-size="16" fill="#617382">03 / 22</text></g>
</svg>
