<text x="1475" y="626.18" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="22" font-weight="400" fill="#15334C" text-anchor="start">记录终止原因和完整性；</text>
<text x="1475" y="655.66" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="22" font-weight="400" fill="#15334C" text-anchor="start">默认关闭本次仿真进程。</text>
<text x="1483" y="725.0" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="24" font-weight="700" fill="#CB5263" text-anchor="start">任务成功 ≠ 地图完整</text>
