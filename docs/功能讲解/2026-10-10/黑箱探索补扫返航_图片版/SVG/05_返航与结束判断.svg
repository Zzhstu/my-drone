<rect x="0" y="0" width="1920" height="1080" fill="white" stroke="none" stroke-width="1.5"/>
<text x="65" y="93.0" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="47" font-weight="700" fill="#15334C" text-anchor="start">返航和结束：需要确认，不是绕一圈就算完成</text>
<text x="68" y="147.0" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="25" font-weight="400" fill="#657585" text-anchor="start">任务结束有两种口径：正常观测收敛，或带原因的部分结果返航</text>
<polyline points="65.00,181.00 1855.00,181.00" fill="none" stroke="#DCE5EB" stroke-width="1"/>
<text x="65" y="1048.0" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="21" font-weight="700" fill="#137B7E" text-anchor="start">机制示意｜这里的返航是在起点附近悬停确认；不声称真机自动降落，也不保证全三维地图完整。</text>
<text x="1764" y="1050.0" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" fill="#657585" text-anchor="start">05 / 07</text>
<rect x="75" y="228" width="835" height="230" fill="#EDF8F0" stroke="#A6D2BD" stroke-width="2"/>
<text x="95" y="270.0" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="700" fill="#15334C" text-anchor="start">正常收敛返航：要同时满足多项条件</text>
<text x="95" y="310.18" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="22" font-weight="400" fill="#15334C" text-anchor="start">完整增益窗口已经变小；已看表面质量至少95%；</text>
<text x="95" y="339.66" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="22" font-weight="400" fill="#15334C" text-anchor="start">没有有用前沿、没有剩余补扫候选；没有目标失败记录，</text>
<text x="95" y="369.14" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="22" font-weight="400" fill="#15334C" text-anchor="start">表面证据与观测格没有容量不足。只认证当前可观测、可达范围。</text>
<rect x="965" y="228" width="879" height="230" fill="#FFF3E5" stroke="#E9C291" stroke-width="2"/>
<text x="985" y="270.0" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="700" fill="#15334C" text-anchor="start">部分结果返航：必须写明原因</text>
<text x="985" y="310.18" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="22" font-weight="400" fill="#15334C" text-anchor="start">探索3600仿真秒或3600真实秒预算到期；补扫预算到期；</text>
<text x="985" y="339.66" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="22" font-weight="400" fill="#15334C" text-anchor="start">视点用尽仍未合格；容量不足；人工请求或显式目标上限。</text>
<text x="985" y="369.14" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="22" font-weight="400" fill="#15334C" text-anchor="start">返回并保存可以成功，但“探索完整”不能因此改成成功。</text>
