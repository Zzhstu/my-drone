<text x="95" y="900.18" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="22" font-weight="400" fill="#15334C" text-anchor="start">偏离起点、暂停、数据过期或机位不安全，都会重置驻留计时。</text>
<text x="95" y="929.66" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="22" font-weight="400" fill="#15334C" text-anchor="start">缺少有效扫描时不继续发新探索航点，由控制器看门狗保持。</text>
<rect x="965" y="818" width="879" height="165" fill="#FFF0F5" stroke="#DFB3C9" stroke-width="2"/>
<text x="985" y="860.0" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="700" fill="#15334C" text-anchor="start">异常保护：保存部分地图，不伪装成成功</text>
<text x="985" y="900.18" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="22" font-weight="400" fill="#15334C" text-anchor="start">返航超过1200仿真秒报告失败；运行器4800真实秒硬保护。</text>
<text x="985" y="929.66" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="22" font-weight="400" fill="#15334C" text-anchor="start">显式保持展示模式可在完成后保留画面，不再进行探索。</text>
