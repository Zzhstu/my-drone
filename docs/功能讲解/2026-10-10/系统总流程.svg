<g id="p21-title" data-pptx-bounds="52 42 1176 120"><text x="52" y="92" font-size="42" font-weight="bold" fill="#16334A">总流程：长期路线与即时安全并行</text><text x="52" y="145" font-size="28" fill="#617382">地图决定往哪里走，最新观测约束这一刻怎样走。</text></g>
