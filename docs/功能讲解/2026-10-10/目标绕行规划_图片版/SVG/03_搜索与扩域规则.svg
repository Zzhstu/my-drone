<text x="1651.0" y="564.6" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="18" font-weight="400" fill="#15334C" text-anchor="middle">最终目标</text>
<rect x="75" y="750" width="540" height="232" fill="#FFF3E5" stroke="#E9C291" stroke-width="2"/>
<text x="95" y="792.0" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="700" fill="#15334C" text-anchor="start">规则一：搜索边界要够大</text>
<text x="95" y="834.18" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" fill="#15334C" text-anchor="start">仓库从4米余量开始；失败后</text>
<text x="95" y="866.3399999999999" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" fill="#15334C" text-anchor="start">扩大到8米、12米，同目标保留</text>
<text x="95" y="898.5" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" fill="#15334C" text-anchor="start">已扩大的范围，避免来回缩放。</text>
<rect x="690" y="750" width="540" height="232" fill="#EDF5FF" stroke="#A8C8E7" stroke-width="2"/>
<text x="710" y="792.0" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="700" fill="#15334C" text-anchor="start">规则二：路径不能抄危险近路</text>
<text x="710" y="834.18" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" fill="#15334C" text-anchor="start">八方向搜索禁止从障碍角缝穿越；</text>
<text x="710" y="866.3399999999999" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" fill="#15334C" text-anchor="start">简化路线时检查整条直线，</text>
<text x="710" y="898.5" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" fill="#15334C" text-anchor="start">不能只看终点格子是否空着。</text>
<rect x="1305" y="750" width="540" height="232" fill="#EFF0FF" stroke="#B7C2EB" stroke-width="2"/>
<text x="1325" y="792.0" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="700" fill="#15334C" text-anchor="start">规则三：无路不能假装到达</text>
<text x="1325" y="834.18" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" fill="#15334C" text-anchor="start">远离终点时，稳定地图不足30点先保持；</text>
<text x="1325" y="866.3399999999999" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" fill="#15334C" text-anchor="start">搜索最多25万格；仍无可行路</text>
<text x="1325" y="898.5" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" fill="#15334C" text-anchor="start">就发布保持位置，等待重规划。</text>
