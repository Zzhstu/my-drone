<rect x="0" y="0" width="1920" height="1080" fill="white" stroke="none" stroke-width="1.5"/>
<text x="65" y="93.0" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="47" font-weight="700" fill="#15334C" text-anchor="start">路线要稳定，也要随真实变化及时调整</text>
<text x="68" y="147.0" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="25" font-weight="400" fill="#657585" text-anchor="start">仓库规则：保留有效旧路、检查实际直飞段；即时安全仍有最终决定权</text>
<polyline points="65.00,181.00 1855.00,181.00" fill="none" stroke="#DCE5EB" stroke-width="1"/>
<text x="65" y="1048.0" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="21" font-weight="700" fill="#137B7E" text-anchor="start">机制示意｜这些规则是工程约束，不是任意未知场景、三维扫掠体或动态轨迹的安全证明。</text>
<text x="1764" y="1050.0" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" fill="#657585" text-anchor="start">05 / 07</text>
<rect x="75" y="225" width="840" height="337" fill="#EDF8F0" stroke="#A6D2BD" stroke-width="2"/>
<text x="95" y="267.0" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="700" fill="#15334C" text-anchor="start">换路规则：不要每次扫描都左右摇摆</text>
<text x="95" y="309.18" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" fill="#15334C" text-anchor="start">旧路线逐段仍可走：新路要缩短超过约25%才换；</text>
<text x="95" y="341.34000000000003" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" fill="#15334C" text-anchor="start">旧路遇到新占用：不受长度门限限制，立即作废。</text>
