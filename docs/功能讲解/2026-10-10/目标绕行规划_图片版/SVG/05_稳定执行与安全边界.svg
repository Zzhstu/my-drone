<text x="1020" y="267.0" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="700" fill="#15334C" text-anchor="start">执行规则：不能隔着拐角追前视点</text>
<text x="1020" y="309.18" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" fill="#15334C" text-anchor="start">前视距离沿折线取点，但飞机实际直飞；</text>
<text x="1020" y="341.34000000000003" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" fill="#15334C" text-anchor="start">直飞段被挡住，就先追最近的可见拐点。</text>
