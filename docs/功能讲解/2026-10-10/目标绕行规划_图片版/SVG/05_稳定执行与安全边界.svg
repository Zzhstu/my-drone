<text x="95" y="651.0" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="700" fill="#15334C" text-anchor="start">仓库规划参数</text>
<text x="95" y="692.18" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="23" font-weight="400" fill="#15334C" text-anchor="start">格子边长0.10米；障碍膨胀0.80米</text>
<text x="95" y="723.0" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="23" font-weight="400" fill="#15334C" text-anchor="start">已含机体半径，另加约0.071米离散余量。</text>
<text x="95" y="753.8199999999999" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="23" font-weight="400" fill="#15334C" text-anchor="start">高度带：目标高度下0.45米、上0.55米。</text>
<text x="95" y="784.64" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="23" font-weight="400" fill="#15334C" text-anchor="start">前视0.60米；导航限速0.25米/秒。</text>
<rect x="690" y="609" width="540" height="315" fill="#EFF0FF" stroke="#B7C2EB" stroke-width="2"/>
<text x="710" y="651.0" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="700" fill="#15334C" text-anchor="start">到达与时效规则</text>
<text x="710" y="692.18" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="23" font-weight="400" fill="#15334C" text-anchor="start">中间航点容差0.03米；最终控制容差0.25米。</text>
<text x="710" y="723.0" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="23" font-weight="400" fill="#15334C" text-anchor="start">规划器距终点0.30米内仍发最终目标。</text>
<text x="710" y="753.8199999999999" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="23" font-weight="400" fill="#15334C" text-anchor="start">航点超过1.5秒未更新，水平导航置零。</text>
<text x="710" y="784.64" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="23" font-weight="400" fill="#15334C" text-anchor="start">风险动作优先，不是“有路就强行飞”。</text>
<rect x="1305" y="609" width="540" height="315" fill="#FFF0F5" stroke="#DFB3C9" stroke-width="2"/>
<text x="1325" y="651.0" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="700" fill="#15334C" text-anchor="start">当前实现的边界</text>
<text x="1325" y="692.18" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="23" font-weight="400" fill="#15334C" text-anchor="start">只有占用格，未观测空白不严格禁行。</text>
<text x="1325" y="723.0" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="23" font-weight="400" fill="#15334C" text-anchor="start">起点有0.20米小范围清除例外。</text>
<text x="1325" y="753.8199999999999" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="23" font-weight="400" fill="#15334C" text-anchor="start">目标被占用时可改找邻近空格，</text>
<text x="1325" y="784.64" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="23" font-weight="400" fill="#15334C" text-anchor="start">不保证原目标到达；地图自身无年龄门控。</text>
<text x="78" y="974.0" xml:space="preserve" font-family="Noto Sans CJK SC,sans-serif" font-size="26" font-weight="700" fill="#24618A" text-anchor="start">此页为指定目标导航；自主探索另有“未知不能走”的栅格与任务规则。</text>
</svg>