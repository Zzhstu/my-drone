<rect x="1212" y="352" width="328" height="132" rx="0" fill="#F4F9FB" stroke="#24618A" stroke-width="1.5"/>
<text x="1376.0" y="396.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="700" fill="#24618A" text-anchor="middle">安全控制</text>
<text x="1376.0" y="432.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#657585" text-anchor="middle">跟踪／停车／有条件退让</text>
<polyline points="1136,418 1204,418" fill="none" stroke="#24618A" stroke-width="2"/>
<polygon points="1204.00,418.00 1194.00,422.80 1194.00,413.20" fill="#24618A"/>
<rect x="848" y="594" width="285" height="110" rx="0" fill="#F4F9FB" stroke="#24618A" stroke-width="1.5"/>
<text x="990.5" y="638.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="700" fill="#24618A" text-anchor="middle">规划或自主探索</text>
<text x="990.5" y="674.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#657585" text-anchor="middle">提供当前航点</text>
<polyline points="1136,649 1375,649 1375,491" fill="none" stroke="#24618A" stroke-width="2"/>
<polygon points="1375.00,491.00 1379.80,501.00 1370.20,501.00" fill="#24618A"/>
<text x="86" y="700.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#15334C" text-anchor="start">长期地图负责路线参考，</text>
<text x="86" y="738.34" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#15334C" text-anchor="start">当前扫描负责即时保护。</text>
