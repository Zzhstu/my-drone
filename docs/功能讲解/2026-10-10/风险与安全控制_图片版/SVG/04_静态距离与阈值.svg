<text x="923" y="316.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="400" fill="#15334C" text-anchor="start">机心没有碰到墙，不代表旋翼有足够间隙。</text>
<text x="923" y="365.88" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="400" fill="#15334C" text-anchor="start">仓库机体半径设为 0.40 米；必须扣除后再判定风</text>
<text x="923" y="401.76" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="400" fill="#15334C" text-anchor="start">险。</text>
<text x="923" y="451.64" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="400" fill="#15334C" text-anchor="start">规划膨胀 0.80 米已包含机体，不要再重复加一次半</text>
<text x="923" y="487.52" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="400" fill="#15334C" text-anchor="start">径。</text>
